[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymorph-etl"
version = "0.1.0"
description = "Schema-aware CLI ETL and migration engine: SQL to NoSQL with crash-safe checkpointing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "pymongo[srv]>=4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1", "cryptography>=42"]
demo = [
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
    "cryptography>=42",
]

[project.scripts]
polymorph = "polymorph.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running MongoDB (docker compose up -d); skipped automatically when it is unreachable",
]
filterwarnings = [
    # SQLite cannot store Decimal natively; SQLAlchemy warns when tests seed it.
    "ignore:Dialect sqlite:sqlalchemy.exc.SAWarning",
]